<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
  <title>My Websites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <h1>My Websites<span aria-hidden="true">.</span></h1>
      <p class="tagline">A home for my projects</p>
      <label class="search-box">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 4.2 4.2"></path></svg>
        <span class="sr-only">Search websites</span>
        <input id="search" type="search" placeholder="Search websites" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
    </header>

    <section aria-label="Websites">
      <div id="website-grid" class="website-grid"></div>
      <p id="no-results" class="no-results" hidden>No websites match that search.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
